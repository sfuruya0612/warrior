[tools]
# ツールの版は ADR-022 で固定する。版は latest にしない。
rust = { version = "1.99.0", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["wasm32-unknown-unknown"] }
"cargo:worker-build" = "0.8.6"
node = "24.21.0"
wrangler = { version = "4.135.0", allow_builds = ["esbuild", "sharp", "workerd"] }
"github:DioxusLabs/dioxus" = "0.7.10"
"github:wasm-bindgen/wasm-bindgen" = "0.2.129"
chromedriver = "157.0.8103.15"
"cargo:cargo-fuzz" = "0.13.2"
ripgrep = "15.2.0"
java = "temurin-25.0.4+101.0.LTS"

[settings]
# Cloudflare のビルド環境が持つグローバル設定のツールまでインストールしない。
# ビルドに必要なツールは、ビルドコマンドで明示的にインストールする。
auto_install = false

[tasks.setup]
description = "開発に必要な依存を取得する"
run = "cargo fetch"

[tasks."ai-eval"]
description = "評価用の記録の fixture と、PRD のプロンプトに渡す入力を出力する"
run = "sh scripts/ai_eval.sh"

[tasks.tokens]
description = "docs/design/tokens.json から CSS と Rust の定数を生成する"
run = "cargo run -q -p warrior_token_gen"

[tasks."tokens:lint-colors"]
description = "frontend の生成物の外に色のリテラル値が無いことを検査する"
run = [
  "rg --version",
  "! rg -n --glob '!generated/**' --pcre2 '#[0-9A-Fa-f]{3,8}\\b' frontend/src",
  "! rg -n --pcre2 '#[0-9A-Fa-f]{3,8}\\b' frontend/tailwind.css",
  "! rg -n --pcre2 'class: \"[^\"]*(rounded|shadow)' frontend/src",
]

[tasks.fmt]
description = "Rust の整形を検査する"
depends = ["tokens"]
run = "cargo fmt --all --check"

[tasks.lint]
description = "Rust の lint と、絵文字と色のリテラル値を使わない規約の検査を実行する"
depends = ["tokens", "tokens:lint-colors"]
run = [
  "cargo clippy --workspace --all-targets -- -D warnings",
  "rg --version",
  "! rg --hidden -g '!.git' --pcre2 '(\\p{Emoji_Presentation}|\\p{Emoji}\\x{FE0F})'",
]

[tasks.test]
description = "結合テストと E2E 以外の自動テストを実行する"
depends = ["tokens"]
run = [
  "cargo test --workspace --exclude warrior --exclude warrior_pbt",
  "cargo test -p warrior --lib",
  "cargo test -p warrior --test fuzz_corpus",
]

[tasks."test-integration"]
description = "wrangler dev を起動する結合テストを実行する"
depends = ["backend:build", "frontend:build", "test-oidc:build"]
run = "cargo test -p warrior --test wrangler_http_foundation --test wrangler_jst_storage --test wrangler_auth --test wrangler_passkey_state --test account_deletion_tables --test wrangler_account_deletion --test wrangler_sync --test wrangler_training_session --test wrangler_ownership --test wrangler_ownership_exercise --test wrangler_calendar --test wrangler_record_exercise --test wrangler_record_set --test wrangler_record_drop_set --test wrangler_record_unilateral_superset --test wrangler_record_reps_rpe --test wrangler_record_time --test wrangler_personal_best --test wrangler_record_edit --test wrangler_routine --test wrangler_profile --test wrangler_user_settings --test wrangler_library --test wrangler_exercise_override --test push_subscription --test rate_limit --test scheduled_cleanup --test exercise_seed --test csv_export --test ai_job --test ai_output --test programs --test nutrition --test rest_push -- --test-threads=1"

[tasks."test-oidc:build"]
description = "テスト専用の OIDC の提供者をビルドする"
run = "cargo build -p warrior_test_oidc"

[tasks.e2e]
description = "Chrome の E2E と、資源の teardown のテストを実行する"
depends = ["backend:build", "frontend:build", "test-oidc:build"]
run = "cargo test -p warrior --test e2e_harness_smoke --test support_teardown --test wrangler_oidc_provider --test wrangler_frontend_smoke --test e2e_auth --test e2e_passkey --test e2e_account_settings --test e2e_account_deletion --test e2e_pwa --test e2e_offline --test e2e_training_session --test e2e_ownership --test e2e_calendar --test e2e_record_exercise --test e2e_record_set --test e2e_record_drop_set --test e2e_record_unilateral_superset --test e2e_record_reps_rpe --test e2e_record_time --test e2e_rest_timer --test e2e_notification --test e2e_push --test e2e_grip --test e2e_personal_best --test e2e_record_edit --test e2e_memo --test e2e_history --test e2e_routine --test e2e_goal --test e2e_body_part_analysis --test e2e_recovery --test e2e_profile --test e2e_settings --test e2e_library --test e2e_exercise_edit --test e2e_csv_export --test e2e_body_figure --test e2e_alternative --test e2e_program_home --test e2e_custom_program --test e2e_nutrition --test e2e_privacy_notice --test e2e_daily_evaluation --test e2e_next_set_proposal --test e2e_menu_optimization"

[tasks."e2e-safari"]
description = "Safari の E2E のスモークを実行する"
depends = ["backend:build", "frontend:build", "test-oidc:build"]
run = """
set -e
export WARRIOR_E2E_BROWSER=safari
cargo test -p warrior --test e2e_harness_smoke --test wrangler_frontend_smoke --test e2e_auth --test e2e_safari_indexeddb --test e2e_training_session --test e2e_calendar
"""

[tasks."test-browser"]
description = "ブラウザの API のテストを headless の Chrome で実行する"
depends = ["tokens"]
run = """
set -e
if ! command -v chromedriver > /dev/null 2>&1; then
  echo "chromedriver is required to run test-browser but was not found" >&2
  exit 1
fi
export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner
export CHROMEDRIVER="$(command -v chromedriver)"
export WASM_BINDGEN_TEST_DRIVER_TIMEOUT=60
export WASM_BINDGEN_TEST_TIMEOUT=300
cargo test -p warrior_frontend --target wasm32-unknown-unknown
"""

[tasks."test-browser-safari"]
description = "ブラウザの API のテストを Safari で実行する"
depends = ["tokens"]
run = """
set -e
export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner
export SAFARIDRIVER=/usr/bin/safaridriver
export WASM_BINDGEN_TEST_WEBDRIVER_JSON="$PWD/frontend/webdriver-safari.json"
export WASM_BINDGEN_TEST_DRIVER_TIMEOUT=60
export WASM_BINDGEN_TEST_TIMEOUT=300
cargo test -p warrior_frontend --target wasm32-unknown-unknown
"""

[tasks."test-pbt"]
description = "性質テストを実行する"
depends = ["tokens"]
run = "cargo test -p warrior_pbt"

[tasks."fuzz:check"]
description = "Fuzzing の対象の型検査を nightly のツールチェーンで実行する"
# cargo-fuzz は sanitizer を使うため nightly を要求する。nightly の要求は Fuzzing の
# タスクだけに閉じ、root の rust-toolchain.toml は変えない。
run = """
set -e
RUSTUP_TOOLCHAIN=nightly cargo fuzz check --fuzz-dir backend/fuzz
"""

[tasks.fuzz]
description = "Fuzzing を実行する (既定の上限は 1 つの対象あたり 60 秒)"
run = """
set -e
seconds="${WARRIOR_FUZZ_SECONDS:-60}"
for target in $(RUSTUP_TOOLCHAIN=nightly cargo fuzz list --fuzz-dir backend/fuzz); do
  RUSTUP_TOOLCHAIN=nightly cargo fuzz run --fuzz-dir backend/fuzz "$target" -- -max_total_time="$seconds" -timeout=10
done
"""

[tasks."backend:build"]
description = "利用者向けの Worker をビルドする"
dir = "backend/warrior"
run = "worker-build --release"

[tasks."frontend:build-service-worker"]
description = "Service Worker の wasm と JavaScript をビルドして配信物に置く"
run = """
set -e
export WARRIOR_SW_VERSION=$(git rev-parse --short HEAD)
cargo build -p warrior_service_worker --target wasm32-unknown-unknown --release
mkdir -p frontend/public/sw
wasm-bindgen --target no-modules --out-dir frontend/public/sw --out-name warrior_sw target/wasm32-unknown-unknown/release/warrior_service_worker.wasm
"""

[tasks."frontend:build"]
description = "Frontend (Dioxus) を Web 向けにリリースビルドする"
depends = ["tokens", "frontend:build-service-worker"]
dir = "frontend"
run = """
set -e
mise exec -- dx build --release --platform web
# dx は public/ の静的ファイルを成果物へ写さないため、配信物に明示的に含める。
cp -R public/. ../target/dx/warrior_frontend/release/web/public/
"""

[tasks."build-frontend"]
description = "Frontend をビルドする (frontend:build の別名)"
depends = ["frontend:build"]

[tasks."build-service-worker"]
description = "Service Worker をビルドする (frontend:build-service-worker の別名)"
depends = ["frontend:build-service-worker"]

[tasks.build]
description = "Worker と Frontend をビルドする"
depends = ["backend:build", "frontend:build"]

[tasks.dev]
description = "ローカル開発の画面と API を同じオリジンから配信する"
depends = ["backend:build", "frontend:build"]
run = "wrangler dev --local"

[tasks.deploy-production]
description = "production の Worker をデプロイする"
depends = ["backend:build", "frontend:build"]
run = "wrangler deploy --env production"

[tasks."verify-production"]
description = "production のプッシュ通知の遅延を D1 から集計する"
run = "sh scripts/verify_production.sh production"

[tasks.db-migrate-local]
description = "ローカルの D1 にマイグレーションを適用する"
run = "wrangler d1 migrations apply DB --local"

[tasks.formal]
description = "認証、レスト通知、編集権、オフライン同期の TLA+ 仕様を TLC で検査する"
run = """
set -e
if ! command -v shasum > /dev/null 2>&1; then
  echo "shasum is required to verify tla2tools.jar but was not found" >&2
  exit 1
fi
mkdir -p formal/.cache
if [ ! -f formal/.cache/tla2tools.jar ]; then
  curl -fsSL --connect-timeout 10 --max-time 300 -o formal/.cache/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
fi
printf '%s  %s\\n' 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88 formal/.cache/tla2tools.jar | shasum -a 256 -c - > /dev/null || {
  echo "tla2tools.jar checksum mismatch: delete formal/.cache/tla2tools.jar and retry" >&2
  exit 1
}
java -cp formal/.cache/tla2tools.jar tlc2.TLC -workers 1 -cleanup -metadir formal/.cache/states -config formal/TrainingOwnership.cfg formal/TrainingOwnership.tla
java -cp formal/.cache/tla2tools.jar tlc2.TLC -workers 1 -cleanup -metadir formal/.cache/states -config formal/OfflineSync.cfg formal/OfflineSync.tla
java -cp formal/.cache/tla2tools.jar tlc2.TLC -workers 1 -cleanup -metadir formal/.cache/states -config formal/Auth.cfg formal/Auth.tla
java -cp formal/.cache/tla2tools.jar tlc2.TLC -workers 1 -cleanup -metadir formal/.cache/states -config formal/RestNotification.cfg formal/RestNotification.tla
"""

[tasks.check]
description = "静的検査と全ての自動テスト、ビルドを実行する (CI と手元の共通の入口)"
depends = ["tokens", "fmt", "lint", "fuzz:check", "test", "test-pbt", "test-browser", "formal", "backend:build", "frontend:build"]
run = """
set -e
mise run test-integration
mise run e2e
"""
